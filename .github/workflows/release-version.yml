# This workflow automatically creates a release PR for the CI integration.

name: Create Release PR

env:
  GIT_AUTHOR_EMAIL: 'packages@datadoghq.com'
  GIT_AUTHOR_NAME: 'ci.datadog-ci'

on:
  workflow_dispatch:
    inputs:
      semver:
        description: 'Semver argument for the version bump to do on the CI integration'
        default: 'minor'
        type: choice
        options:
          - 'patch'
          - 'minor'
          - 'major'

permissions: {}

jobs:
  create-release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Do the changes
      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.get-token.outputs.token }}
      - name: Install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'yarn'
      - name: Create release branch
        run: git checkout -b local-branch
      - name: Set git user
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
      - name: Install dependencies
        run: yarn install
      - name: Bump CI integration version
        id: bump-version
        env:
          INPUT_SEMVER: ${{ github.event.inputs.semver }}
        run: |
          OLD_VERSION_TAG="v$(jq -r '.version' package.json)" # e.g. v1.0.0

          # The `version` command only bumps the version in package.json. It doesn't commit nor tag.
          yarn version "$INPUT_SEMVER"

          NEW_VERSION_TAG="v$(jq -r '.version' package.json)" # e.g. v1.1.0

          # Update README with new version
          sed -i "s/$OLD_VERSION_TAG/$NEW_VERSION_TAG/" README.md

          echo "NEW_VERSION_TAG=$NEW_VERSION_TAG" >> "$GITHUB_OUTPUT"
      - name: Update build files
        run: |
          yarn build
          yarn package
      - name: Commit new version
        env:
          NEW_VERSION_TAG: ${{ steps.bump-version.outputs.NEW_VERSION_TAG }}
        run: |
          git add --all
          git commit -m "$NEW_VERSION_TAG"
      - name: Push the branch
        env:
          NEW_VERSION_TAG: ${{ steps.bump-version.outputs.NEW_VERSION_TAG }}
        run: git push -u origin "local-branch:release/$NEW_VERSION_TAG"

      # Create the pull request
      - name: Generate release notes
        id: generate-release-notes
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NEW_VERSION_TAG: ${{ steps.bump-version.outputs.NEW_VERSION_TAG }}
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const { data: releaseNotes } = await github.rest.repos.generateReleaseNotes({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: process.env.NEW_VERSION_TAG,
            })

            core.setOutput('RELEASE_NOTES', releaseNotes.body)
      - name: Create pull request
        id: create-pull-request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NEW_VERSION_TAG: ${{ steps.bump-version.outputs.NEW_VERSION_TAG }}
          INPUT_SEMVER: ${{ github.event.inputs.semver }}
          RELEASE_NOTES: ${{ steps.generate-release-notes.outputs.RELEASE_NOTES }}
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const newVersionTag = process.env.NEW_VERSION_TAG;
            const semver = process.env.INPUT_SEMVER;
            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: `release/${newVersionTag}`,
              title: `[release:${semver}] \`${newVersionTag}\``,
              body: process.env.RELEASE_NOTES
            })

            core.setOutput('PULL_REQUEST_NUMBER', pullRequest.number)
      - name: Create comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          NEW_VERSION_TAG: ${{ steps.bump-version.outputs.NEW_VERSION_TAG }}
          PULL_REQUEST_NUMBER: ${{ steps.create-pull-request.outputs.PULL_REQUEST_NUMBER }}
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const newVersionTag = process.env.NEW_VERSION_TAG;
            const body = `Once merged, this PR will automatically create a GitHub release for you.
            The description of the release will exactly match this PR's description. Feel free to edit it.

            > [!WARNING]
            > The release will be created **but not published** on the GitHub Marketplace (because the API doesn't allow that).
            >
            > To publish it manually, please edit the release [here](https://github.com/DataDog/synthetics-ci-github-action/releases/edit/${newVersionTag}).
            > Make sure the \`Publish this Action to the GitHub Marketplace\` checkbox is checked, and click \`Update release\`.`

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PULL_REQUEST_NUMBER),
              body,
            })
