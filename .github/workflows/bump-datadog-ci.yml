# This workflow automatically creates a PR bumping datadog-ci in the CI integration.

name: Bump Datadog CI

env:
  GIT_AUTHOR_EMAIL: 'packages@datadoghq.com'
  GIT_AUTHOR_NAME: 'ci.datadog-ci'

on:
  workflow_dispatch:
    inputs:
      datadog_ci_version:
        description: 'Version of datadog-ci to install (`latest` or `major.minor.patch`)'
        type: string
        default: 'latest'

permissions: {}

jobs:
  bump-datadog-ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Do the changes
      - name: Get GitHub App token
        id: get-token
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        with:
          app-id: ${{ secrets.RELEASE_AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.RELEASE_AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ steps.get-token.outputs.token }}
      - name: Install node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 'lts/*'
          cache: 'yarn'
      - name: Create release branch
        run: git checkout -b local-branch
      - name: Set git user
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
      - name: Install dependencies
        run: yarn install
      - name: Bump datadog-ci
        id: bump-datadog-ci
        env:
          INPUT_VERSION: ${{ github.event.inputs.datadog_ci_version }}
        run: |
          VERSION=$(printf '%s' "$INPUT_VERSION" | tr -d '\n\r')
          if [ "$VERSION" = "latest" ]; then
            VERSION=$(npm view @datadog/datadog-ci --json | jq -r '.version')
          fi

          yarn add "@datadog/datadog-ci@^${VERSION}"
          safe_version=$(printf '%s' "$VERSION" | tr -d '\n\r')
          echo "VERSION=$safe_version" >> $GITHUB_OUTPUT
      - name: Create bump commit
        env:
          BUMP_VERSION: ${{ steps.bump-datadog-ci.outputs.VERSION }}
        run: |
          safe_version=$(printf '%s' "$BUMP_VERSION" | tr -d '\n\r')
          git commit -a --message "[dep] Bump datadog-ci to \`${safe_version}\`"
      - name: Push the branch
        env:
          BUMP_VERSION: ${{ steps.bump-datadog-ci.outputs.VERSION }}
        run: |
          safe_version=$(printf '%s' "$BUMP_VERSION" | tr -d '\n\r')
          git push -u origin "local-branch:bump-datadog-ci/${safe_version}"

      # Create the pull request
      - name: Create pull request
        id: create-pull-request
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          BUMP_VERSION: ${{ steps.bump-datadog-ci.outputs.VERSION }}
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const version = process.env.BUMP_VERSION;
            const { data: pullRequest } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: 'main',
              head: `bump-datadog-ci/${version}`,
              title: `[dep] Bump datadog-ci to \`${version}\``,
              body: `This PR bumps [datadog-ci](https://github.com/DataDog/datadog-ci) to version [\`${version}\`](https://github.com/DataDog/datadog-ci/releases/tag/v${version})`
            })

            core.setOutput('PULL_REQUEST_NUMBER', pullRequest.number)
      - name: Create comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PULL_REQUEST_NUMBER: ${{ steps.create-pull-request.outputs.PULL_REQUEST_NUMBER }}
        with:
          github-token: ${{ steps.get-token.outputs.token }}
          script: |
            const body = `This PR was automatically created because a new version of datadog-ci was published.

            > [!IMPORTANT]
            > **You are not done!**
            >
            > Once this PR is merged, please run the ["Create Release PR" workflow](../actions/workflows/release-version.yml).
            > This time, it will create a **release PR** for you, which will publish the CI integration once merged.`

            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PULL_REQUEST_NUMBER),
              body,
            })
