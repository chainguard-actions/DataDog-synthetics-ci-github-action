name: Test config-path, files, and junit-report inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a minimal datadog-ci config file
        run: |
          mkdir -p /tmp/dd-config
          cat > /tmp/dd-config/datadog-ci.json <<'EOF'
          {
            "apiKey": "fake-api-key",
            "appKey": "fake-app-key",
            "datadogSite": "datadoghq.com"
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: 'fake-api-key-00000000000000000000000000000000'
          app-key: 'fake-app-key-0000000000000000000000000000000000000000'
          config-path: '/tmp/dd-config/datadog-ci.json'
          files: '**/*.synthetics.json'
          junit-report: '/tmp/junit-report.xml'
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
          datadog-site: 'datadoghq.com'
      - name: Assert action ran (step outcome is not cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: step was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: step completed (success or failure) without being cancelled"
      - name: Assert outputs are accessible
        env:
          CRITICAL_ERRORS: ${{ steps.action.outputs.critical-errors-count }}
          FAILED_COUNT: ${{ steps.action.outputs.failed-count }}
          PASSED_COUNT: ${{ steps.action.outputs.passed-count }}
        run: |
          echo "critical-errors-count: $CRITICAL_ERRORS"
          echo "failed-count: $FAILED_COUNT"
          echo "passed-count: $PASSED_COUNT"
          echo "PASS: outputs are accessible (values may be empty with fake credentials)"
