name: Test config-path input is accepted
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a minimal datadog-ci config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dd-ci-config"
          cat > "$GITHUB_WORKSPACE/dd-ci-config/datadog-ci.json" <<'EOF'
          {
            "datadogSite": "datadoghq.com"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          config-path: dd-ci-config/datadog-ci.json
          public-ids: abc-def-123
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'

      - name: Assert action ran (failed due to invalid credentials, as expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials, the action should fail (auth error or critical error)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
