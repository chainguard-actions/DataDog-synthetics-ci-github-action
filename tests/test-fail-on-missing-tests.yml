name: Test fail-on-missing-tests option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          public-ids: abc-def-123
          fail-on-missing-tests: 'true'
          datadog-site: datadoghq.com

      - name: Assert action ran (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TESTS_NOT_FOUND: ${{ steps.action.outputs.tests-not-found-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tests-not-found-count: $TESTS_NOT_FOUND"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials or missing tests)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
