name: Test fail-on-missing-tests behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with fail-on-missing-tests disabled
        id: action-no-fail
        uses: .
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
        continue-on-error: true
      - name: Assert action ran (missing tests should not block CI)
        env:
          OUTCOME: ${{ steps.action-no-fail.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to have run (success or failure), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran with outcome=$OUTCOME"
