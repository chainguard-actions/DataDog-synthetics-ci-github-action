name: Test custom Datadog site configuration
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          datadog-site: datadoghq.eu
          public-ids: abc-def-123
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
          variables: 'MY_VAR=test_value,ANOTHER_VAR=hello'
        continue-on-error: true
      - name: Assert action ran with custom site
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to have run (success or failure), got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action ran with custom site, outcome=$OUTCOME"
