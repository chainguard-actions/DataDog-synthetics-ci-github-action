name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a datadog-ci config file
        run: |
          cat > /tmp/datadog-ci.json <<'EOF'
          {
            "datadogSite": "datadoghq.com"
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          config-path: /tmp/datadog-ci.json
          fail-on-critical-errors: 'false'
          public-ids: 'abc-def-ghi'

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted config-path input and ran with outcome=$OUTCOME"
