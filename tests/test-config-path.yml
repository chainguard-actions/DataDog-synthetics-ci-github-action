name: Test config-path input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a datadog-ci config file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/hardened/tests/fixtures/config"
          cat > "$GITHUB_WORKSPACE/hardened/tests/fixtures/config/datadog-ci.json" <<'EOF'
          {
            "datadogSite": "datadoghq.com",
            "testSearchQuery": "tag:ci"
          }
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          config-path: hardened/tests/fixtures/config/datadog-ci.json
          public-ids: abc-def-123
      - name: Assert action ran with config-path input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with config-path"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
