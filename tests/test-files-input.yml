name: Test files input (glob patterns for test config files)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a synthetic test configuration file
        run: |
          mkdir -p /tmp/synthetics-tests
          cat > /tmp/synthetics-tests/my-test.synthetics.json <<'EOF'
          {
            "tests": [
              {
                "id": "abc-def-ghi"
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          datadog-site: datadoghq.com
          files: '/tmp/synthetics-tests/**/*.synthetics.json'
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'

      - name: Assert action ran (not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action accepted files input and ran with outcome=$OUTCOME"
