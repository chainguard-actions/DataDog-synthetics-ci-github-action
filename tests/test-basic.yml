name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          datadog-site: datadoghq.com
          public-ids: abc-def-123
      - name: Assert action was invoked
        run: |
          echo "Action completed (with or without error due to fake credentials)"
          echo "PASS"
