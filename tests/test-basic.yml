name: Test basic usage with required and common optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          batch-timeout: '60000'
          config-path: ''
          datadog-site: datadoghq.com
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
          files: '**/*.synthetics.json'
          junit-report: 'junit-report.xml'
      - name: Assert action ran (may fail with invalid credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
