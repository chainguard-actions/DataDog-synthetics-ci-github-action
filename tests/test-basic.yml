name: Test basic usage with fake credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          datadog-site: datadoghq.com
          public-ids: abc-123-def
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
      - name: Assert action ran (step outcome is not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"
      - name: Assert outputs are present or empty strings (not undefined)
        env:
          BATCH_URL: ${{ steps.action.outputs.batch-url }}
          FAILED_COUNT: ${{ steps.action.outputs.failed-count }}
          PASSED_COUNT: ${{ steps.action.outputs.passed-count }}
          CRITICAL_ERRORS: ${{ steps.action.outputs.critical-errors-count }}
        run: |
          echo "batch-url: '$BATCH_URL'"
          echo "failed-count: '$FAILED_COUNT'"
          echo "passed-count: '$PASSED_COUNT'"
          echo "critical-errors-count: '$CRITICAL_ERRORS'"
          echo "PASS: outputs are accessible"
