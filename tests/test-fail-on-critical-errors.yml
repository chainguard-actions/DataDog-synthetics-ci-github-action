name: Test fail-on-critical-errors behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: 'fake-api-key-for-testing'
          app-key: 'fake-app-key-for-testing'
          datadog-site: 'datadoghq.com'
          fail-on-critical-errors: 'true'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
          public-ids: 'abc-def-ghi'

      - name: Assert action failed due to critical error (invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With invalid credentials and fail-on-critical-errors=true,
          # the action should fail (authentication failure is a critical error).
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid credentials and fail-on-critical-errors=true, but got outcome=${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed on critical error (auth failure)"
