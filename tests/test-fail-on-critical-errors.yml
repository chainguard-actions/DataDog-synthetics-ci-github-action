name: Test fail-on-critical-errors behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          datadog-site: datadoghq.com
          public-ids: abc-def-123
          fail-on-critical-errors: 'true'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
        continue-on-error: true
      - name: Assert action fails with critical errors enabled and fake credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake credentials and fail-on-critical-errors=true,
          # the action should fail due to authentication error (a critical error)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on critical error (auth failure)"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
