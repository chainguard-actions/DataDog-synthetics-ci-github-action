name: Test files glob pattern input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a synthetic test config file for the glob to discover
      - name: Create synthetic test config file
        run: |
          mkdir -p /tmp/synthetics-tests
          cat > /tmp/synthetics-tests/my-test.synthetics.json << 'EOF'
          {
            "tests": [
              {
                "id": "abc-def-123",
                "config": {}
              }
            ]
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          files: |
            /tmp/synthetics-tests/*.synthetics.json
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'

      - name: Assert action ran (failed due to invalid credentials, as expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials, the action should fail (auth error or critical error)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
