name: Test variables and locations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          public-ids: abc-def-123
          datadog-site: datadoghq.com
          variables: |
            START_URL=https://example.org
            MY_VARIABLE=My title
          locations: |
            aws:us-east-1
            aws:eu-west-1

      - name: Assert action ran and failed gracefully with variables and locations
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but valid)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected (invalid credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
