name: Test variables and locations inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: 'fake-api-key-for-testing'
          app-key: 'fake-app-key-for-testing'
          datadog-site: 'datadoghq.com'
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
          public-ids: 'abc-def-ghi'
          variables: 'MY_VAR=hello,ANOTHER_VAR=world'
          locations: 'aws:us-east-1,aws:eu-west-1'
          tunnel: 'false'

      - name: Assert action ran with variables and locations inputs
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action should run (not crash on input parsing) even with fake credentials.
          if [ "${{ steps.action.outcome }}" = "" ]; then
            echo "FAIL: action did not run"
            exit 1
          fi
          echo "PASS: action ran with variables and locations inputs, outcome=${{ steps.action.outcome }}"
