name: Test test-search-query input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          test-search-query: 'tag:team-backend'
          datadog-site: datadoghq.com
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'

      - name: Assert action ran (failed due to invalid credentials, as expected)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With fake credentials, the action should fail (auth error or critical error)
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected with invalid credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action unexpectedly succeeded (acceptable)"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
