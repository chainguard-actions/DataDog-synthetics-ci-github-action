name: Test variables input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          variables: |
            START_URL=https://example.org
            MY_VARIABLE=My title
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
        continue-on-error: true
      - name: Assert outputs are accessible
        env:
          FAILED_COUNT: ${{ steps.action.outputs.failed-count }}
          PASSED_COUNT: ${{ steps.action.outputs.passed-count }}
          PREVIOUSLY_PASSED: ${{ steps.action.outputs.previously-passed-count }}
          FAILED_NON_BLOCKING: ${{ steps.action.outputs.failed-non-blocking-count }}
        run: |
          echo "failed-count: $FAILED_COUNT"
          echo "passed-count: $PASSED_COUNT"
          echo "previously-passed-count: $PREVIOUSLY_PASSED"
          echo "failed-non-blocking-count: $FAILED_NON_BLOCKING"
          echo "PASS: action accepted variables input and outputs were accessible"
