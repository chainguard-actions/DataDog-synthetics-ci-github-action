name: Test auth failure graceful handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: 'fake-api-key-00000000000000000000000000000000'
          app-key: 'fake-app-key-0000000000000000000000000000000000000000'
          public-ids: 'abc-def-ghi'
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
          datadog-site: 'datadoghq.com'
      - name: Assert action ran (step outcome is not cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          if [ "$OUTCOME" = "cancelled" ]; then
            echo "FAIL: step was cancelled unexpectedly"
            exit 1
          fi
          echo "PASS: step completed (success or failure) without being cancelled"
      - name: Assert critical-errors-count output is set
        env:
          CRITICAL_ERRORS: ${{ steps.action.outputs.critical-errors-count }}
        run: |
          echo "critical-errors-count: $CRITICAL_ERRORS"
          # With fake credentials, we expect either a critical error count > 0
          # or the output to be set (possibly 0 if the action handles it differently)
          # The key assertion is that the output variable is defined (not empty means action ran)
          if [ -z "$CRITICAL_ERRORS" ]; then
            echo "NOTE: critical-errors-count output is empty - action may have exited before setting outputs"
            echo "This is acceptable for an auth failure scenario"
          else
            echo "PASS: critical-errors-count output is set to: $CRITICAL_ERRORS"
          fi
      - name: Assert step did not succeed with fake credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "step outcome: $OUTCOME"
          # With fake credentials, the action should not succeed
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded with fake credentials - this may indicate the action is not validating credentials"
          else
            echo "PASS: action did not succeed with fake credentials (outcome: $OUTCOME)"
          fi
