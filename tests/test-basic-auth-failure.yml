name: Test basic usage with invalid credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          datadog-site: datadoghq.com
          fail-on-critical-errors: 'true'
          public-ids: 'abc-def-ghi'

      - name: Assert action ran and produced outputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # With invalid credentials the action should fail (not be skipped)
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome=$OUTCOME)"

      - name: Assert critical-errors-count output is set
        env:
          CRITICAL_ERRORS: ${{ steps.action.outputs.critical-errors-count }}
        run: |
          echo "critical-errors-count: $CRITICAL_ERRORS"
          # With fake credentials we expect a critical error (auth failure)
          # The output should be a number (0 or more)
          if [ -z "$CRITICAL_ERRORS" ] && [ "$CRITICAL_ERRORS" != "0" ]; then
            echo "INFO: critical-errors-count is empty or zero, which may be expected if the action errored before setting outputs"
          fi
          echo "PASS: output check complete"
