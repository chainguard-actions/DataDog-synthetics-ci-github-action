name: Test basic inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key-for-testing
          app-key: fake-app-key-for-testing
          datadog-site: datadoghq.com
          batch-timeout: '30000'
          fail-on-critical-errors: 'false'
          fail-on-missing-tests: 'false'
          fail-on-timeout: 'false'
          public-ids: 'abc-def-ghi'
          junit-report: 'junit-report.xml'
          subdomain: 'app'
          tunnel: 'false'
      - name: Assert action ran (outputs exist or action failed gracefully)
        env:
          BATCH_URL: ${{ steps.action.outputs.batch-url }}
          FAILED_COUNT: ${{ steps.action.outputs.failed-count }}
          PASSED_COUNT: ${{ steps.action.outputs.passed-count }}
        run: |
          echo "batch-url: $BATCH_URL"
          echo "failed-count: $FAILED_COUNT"
          echo "passed-count: $PASSED_COUNT"
          echo "PASS: action ran with basic inputs (continue-on-error allows credential failures)"
