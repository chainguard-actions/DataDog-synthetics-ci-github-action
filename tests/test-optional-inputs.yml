name: Test optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          public-ids: abc-def-123
          datadog-site: datadoghq.com
          fail-on-critical-errors: 'false'
          fail-on-timeout: 'true'
          batch-timeout: '120000'
          variables: 'MY_VAR=hello,OTHER_VAR=world'
          locations: 'aws:us-east-1'

      - name: Assert action ran with optional inputs (fails gracefully with fake credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TIMED_OUT: ${{ steps.action.outputs.timed-out-count }}
          SKIPPED: ${{ steps.action.outputs.tests-skipped-count }}
        run: |
          echo "outcome: $OUTCOME"
          echo "timed-out-count: $TIMED_OUT"
          echo "tests-skipped-count: $SKIPPED"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with optional inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
