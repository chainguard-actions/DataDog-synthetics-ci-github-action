name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          locations: 'aws:us-east-1'
          public-ids: 'abc-def-ghi'
          selective-rerun: 'false'
          subdomain: 'app'
          test-search-query: 'tag:ci'
          tunnel: 'false'
          variables: 'START_URL=https://example.org'
      - name: Assert action ran (may fail with invalid credentials)
        run: |
          echo "Action completed with outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step was reached and executed"
