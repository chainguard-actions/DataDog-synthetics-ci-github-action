name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          batch-timeout: '60000'
          config-path: datadog-ci.json
          fail-on-critical-errors: 'false'
          fail-on-timeout: 'true'
          junit-report: results.xml
          locations: |
            aws:us-east-1
          selective-rerun: 'false'
          subdomain: myorg
          test-search-query: 'tag:ci'
          tunnel: 'false'
          variables: |
            MY_VAR=my_value
      - name: Assert action ran (may fail due to invalid credentials)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          echo "PASS: action step executed with optional inputs"
