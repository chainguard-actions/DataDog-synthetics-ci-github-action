name: Test optional inputs coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          batch-timeout: "60000"
          config-path: ./datadog-ci.json
          datadog-site: datadoghq.com
          fail-on-critical-errors: "false"
          fail-on-missing-tests: "false"
          fail-on-timeout: "false"
          files: "**/*.synthetics.json"
          junit-report: junit-report.xml
          locations: "aws:us-east-1"
          public-ids: abc-def-123
          selective-rerun: "false"
          subdomain: app
          test-search-query: "tag:ci"
          tunnel: "false"
          variables: "START_URL=https://example.org,MY_VARIABLE=My title"
      - name: Assert action was invoked with all optional inputs
        run: |
          echo "Action completed (with or without error due to fake credentials)"
          echo "All optional inputs were passed to the action"
          echo "PASS"
