name: Test junit-report and files inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          api-key: fake-api-key
          app-key: fake-app-key
          datadog-site: datadoghq.com
          files: |
            **/*.synthetics.json
            **/*.datadog-ci.json
          junit-report: junit-results.xml
          fail-on-missing-tests: 'false'

      - name: Assert action ran with junit-report and files inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          TESTS_NOT_FOUND: ${{ steps.action.outputs.tests-not-found-count }}
          RAW_RESULTS: ${{ steps.action.outputs.raw-results }}
        run: |
          echo "outcome: $OUTCOME"
          echo "tests-not-found-count: $TESTS_NOT_FOUND"
          echo "raw-results: $RAW_RESULTS"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials or no test files found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
